[project]
name = "events-tool"
version = "0.1.0"
description = "A personal, source-agnostic events discovery and calendar tool."
requires-python = ">=3.9"

[project.scripts]
events = "events_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
